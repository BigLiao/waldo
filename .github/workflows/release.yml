name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build release binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease" >&2
            exit 1
          fi
          make release VERSION="${TAG#v}" BUILD="$(git rev-parse --short=12 HEAD)"
          expected="${TAG#v}+$(git rev-parse --short=12 HEAD)"
          test "$(dist/waldo-linux-amd64 version)" = "$expected"
          cd dist
          sha256sum waldo-linux-amd64 waldo-linux-arm64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/waldo-linux-amd64 dist/waldo-linux-arm64 dist/SHA256SUMS "${args[@]}"
