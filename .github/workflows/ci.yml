name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap openssh-server sshfs fuse3 curl python3 ripgrep
          sudo mkdir -p /run/sshd
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse
          # Allow bwrap namespaces on this disposable Ubuntu runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check test prerequisites
        run: |
          for tool in bwrap git ssh ssh-keygen sshfs fusermount3 curl python3; do
            command -v "$tool"
          done
          test -x /usr/sbin/sshd
          test -r /dev/fuse && test -w /dev/fuse
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc true
      - name: Verify dependencies
        run: go mod verify
      - name: Vet and test
        run: make test
