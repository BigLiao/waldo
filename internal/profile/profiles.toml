# Built-in agent profiles. Users may add or override profiles in
# ~/.config/waldo/config.toml with the same [agent.<name>] tables.

[agent.claude]
telemetry = "claude"
tool_hooks = "claude"
bin    = "claude"
mcp_config_flag = "--mcp-config"
skill_dir = "~/.claude/skills"
env    = { USE_BUILTIN_RIPGREP = "0", DISABLE_AUTOUPDATER = "1" }
shared = ["~/.claude/shell-snapshots"]
scrub  = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL", "ANTHROPIC_DEFAULT_OPUS_MODEL", "ANTHROPIC_DEFAULT_SONNET_MODEL", "ANTHROPIC_DEFAULT_HAIKU_MODEL"]
needs  = ["rg", "git", "bash"]
state  = ["~/.claude", "~/.claude.json"]

[agent.codex]
telemetry = "codex"
bin    = "codex"
args   = ["--sandbox", "danger-full-access"]
scrub  = ["OPENAI_API_KEY", "CODEX_API_KEY", "OPENAI_BASE_URL"]
needs  = ["git", "bash"]
state  = ["~/.codex"]
